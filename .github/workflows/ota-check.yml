name: Check over-the-air updates (diagnostic)
on:
  push:
    branches: [diagnostics]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ask the update server what a 1.0.6 phone receives
        run: |
          {
            echo "== Manifest request (android, runtime 1, channel production) =="
            curl -s -D - "https://u.expo.dev/5ce3a8f5-68b4-4aea-a712-5a2c456a0f31" \
              -H "expo-platform: android" -H "expo-runtime-version: 1" \
              -H "expo-channel-name: production" -H "expo-protocol-version: 1" \
              -H "accept: multipart/mixed,application/expo+json,application/json" | head -c 4000
            echo
          } > ota-check.txt 2>&1
      - name: List channels and updates
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          {
            echo "== Runtime version from app config =="
            npx expo config --type public --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const c=JSON.parse(s);console.log(JSON.stringify({runtimeVersion:c.runtimeVersion,version:c.version,updates:c.updates},null,2))})'
            echo "== Channel production =="
            npx --yes eas-cli@27.5.0 channel:view production --json --non-interactive 2>&1 | head -c 3000
            echo
            echo "== Updates on branch production =="
            npx --yes eas-cli@27.5.0 update:list --branch production --json --non-interactive 2>&1 | head -c 4000
          } >> ota-check.txt 2>&1
      - name: Publish the result
        if: always()
        run: |
          cp ota-check.txt /tmp/ota-check.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan build-logs
          git rm -rf --cached . > /dev/null
          cp /tmp/ota-check.txt ota-check.txt
          git add ota-check.txt
          git commit -m "OTA check"
          git push -f origin build-logs
