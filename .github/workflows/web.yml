name: Publish web version

# The same app, built for the web and published to GitHub Pages at
# https://tuckypsyc.github.io/curiouser/ for friends on iPhone.
# Needs Settings → Pages → Source set to "GitHub Actions" (one-off). Until then it
# only runs when started by hand, so it doesn't fail on every push. Once Pages is on,
# add a `push: branches: [main]` trigger here.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/build-feed.mjs
      - run: npx expo export --platform web
      # Single-page app: send unknown paths back to the app instead of a 404.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
