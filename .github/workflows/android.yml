name: Build Android app

# Builds an installable APK and publishes it as the latest GitHub release, so
# https://github.com/TuckyPsyc/curiouser/releases/latest/download/curiouser.apk
# always points at the newest version.
#
# Only native-level changes need a new APK: dependencies, app config, icons and
# this workflow. Screen and feature changes in src/ reach phones over the air
# (update.yml), and stories are fetched at runtime.
on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'
      - 'app.config.js'
      - 'eas.json'
      - 'assets/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci 2>&1 | tee -a build.log

      - name: Check stories and bundle them into the app
        run: node scripts/build-feed.mjs 2>&1 | tee -a build.log

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install 2>&1 | tee -a build.log

      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a 2>&1 | tee -a ../build.log

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk curiouser.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Curiouser 1.0.${{ github.run_number }}
          make_latest: true
          files: curiouser.apk
          body: |
            Get curiouser before breakfast.

            **To install on Android:** open this page on your phone, tap `curiouser.apk` below, then open the download.
            If asked, allow your browser to install unknown apps. New stories arrive automatically; you only
            need to reinstall when a new version of the app itself comes out.

      # Build logs are hard to read without signing in, so on failure the tail of the
      # log is pushed to a separate branch where it can be read like any other file.
      - name: Publish the build log on failure
        if: failure()
        run: |
          tail -n 400 build.log > /tmp/build-log.txt 2>/dev/null || echo "No log captured" > /tmp/build-log.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan build-logs
          git rm -rf --cached . > /dev/null
          cp /tmp/build-log.txt build-log.txt
          git add build-log.txt
          git commit -m "Build log for run ${{ github.run_number }}"
          git push -f origin build-logs
